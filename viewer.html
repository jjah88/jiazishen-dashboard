<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10263d"><title>研究看板｜甲子申</title><style>
:root{--navy:#10263d;--navy2:#193c58;--gold:#c5a46a;--paper:#f5f4ef;--ink:#1b2d3c;--muted:#6c7a83}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.top{height:64px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1160px)/2));gap:15px}.brand{font-size:13px;letter-spacing:2px;font-weight:650}.top a{color:#d8c49a;font-size:12px;text-decoration:none}.status{padding:10px 20px;font-size:12px;color:var(--muted);background:#ecece6}.frame-wrap{position:relative;width:100%;height:calc(100vh - 104px);min-height:600px;background:#fff;overflow:hidden}.frame{width:100%;height:100%;border:0;background:white;display:block}.frame.preview-locked{pointer-events:none;overflow:hidden}.gate{position:absolute;left:0;right:0;top:60%;bottom:0;display:none;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(245,244,239,.90),#f5f4ef 18%);border-top:1px solid #d9d4c7}.gate-card{width:min(760px,100%);background:#10263d;color:white;padding:clamp(24px,4vw,42px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 18px 50px #10263d22}.gate h1{font-size:clamp(22px,3vw,30px);margin:0 0 12px;line-height:1.35}.gate p{font-size:14px;line-height:1.9;color:#d0dbe1;margin:0}.qr{width:132px;height:132px;object-fit:contain;background:#fff;padding:6px}.qr-placeholder{width:132px;height:132px;background:#fff;color:#315b68;display:grid;place-items:center;text-align:center;font-size:12px;padding:12px}.footnote{font-size:11px;color:#9eb0b9;margin-top:14px;line-height:1.7}.error{padding:40px 20px;line-height:1.8}.member-wall{max-width:780px;margin:48px auto;padding:0 18px}.member-card{background:#fff;border:1px solid #e0e4e5;border-radius:14px;padding:clamp(24px,5vw,44px);box-shadow:0 16px 42px #10263d0c}.member-card h1{font-size:clamp(24px,4vw,34px);line-height:1.3;color:var(--navy);margin:0 0 12px}.member-card p{font-size:14px;line-height:1.9;color:var(--muted)}.member-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.member-actions a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:11px 16px;border-radius:6px;font-size:13px}.member-actions a.secondary{background:#fff;color:var(--navy);border:1px solid #ccd4da}.member-qr{width:130px;height:130px;object-fit:contain;background:#fff;margin-top:12px}.member-status{font-size:13px;color:#8c5a24;margin-top:12px;line-height:1.7}.member-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.member-actions a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:10px 14px;border-radius:6px;font-size:13px}.member-actions a.secondary{background:#fff;color:var(--navy);border:1px solid #ccd4da}@media(max-width:640px){.top{height:58px}.frame-wrap{height:calc(100vh - 98px);min-height:540px}.gate{top:60%;padding:12px}.gate-card{grid-template-columns:1fr;padding:22px;gap:16px}.qr,.qr-placeholder{width:100px;height:100px}}
</style></head><body><header class="top"><a class="brand" href="./" style="color:white">甲子申 · 产业研究</a><a href="./">返回看板中心 ↗</a></header><div class="status" id="status">正在读取看板设置……</div><main id="main"><div class="frame-wrap"><iframe id="board-frame" class="frame" title="产业研究看板"></iframe><section id="gate" class="gate"><div class="gate-card"><div><h1 id="gate-title">查看完整研究内容</h1><p id="gate-copy">当前为预览版。完整产业数据与深度研究，可扫码咨询定制服务。</p><div class="footnote">预览版只展示部分研究内容。注册/登录并开通会员后，可查看完整看板。</div><div class="member-actions" id="gate-actions"></div></div><div id="qr-area"><div class="qr-placeholder">微信扫码<br>了解会员服务</div></div></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://zlfedybzoxlvjbzpluuo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Ys9qA2p-xcMMGGUPMbHbJw_6_HdzMkQ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showMessage(title,body,actions="",qrUrl="",status=""){
 document.getElementById("main").innerHTML=`<section class="member-wall"><div class="member-card"><h1>${safe(title)}</h1><p>${safe(body)}</p>${status?`<div class="member-status">${safe(status)}</div>`:""}${qrUrl?`<img class="member-qr" src="${safe(qrUrl)}" alt="甲子申咨询二维码">`:""}<div class="member-actions">${actions}</div></div></section>`;
}
function setGate(d,id,loggedIn,reason=""){
 const gate=document.getElementById("gate");
 const pct=Math.max(20,Math.min(70,Number(d.preview_percent)||45));gate.style.top=pct+"%";gate.style.display="flex";
 document.getElementById("gate-title").textContent=loggedIn?"会员开通后查看完整研究内容":"登录并开通会员，查看完整研究内容";
 document.getElementById("gate-copy").textContent=reason||d.consult_text||"当前为公开预览。注册/登录后，开通甲子申会员即可查看完整产业研究内容。";
 const ret="viewer.html?id="+encodeURIComponent(id);
 document.getElementById("gate-actions").innerHTML=`<a href="member.html?return=${encodeURIComponent(ret)}">登录 / 注册 / 会员状态</a><a class="secondary" href="./">返回看板中心</a>`;
 if(d.qr_url)document.getElementById("qr-area").innerHTML='<img class="qr" alt="甲子申咨询二维码" src="'+safe(d.qr_url)+'">';
}
async function tryLoadMemberHtml(id){
 const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError)throw sessionError;
 if(!session?.user)return {loggedIn:false,active:false};
 const {data:access,error}=await db.functions.invoke("get-private-dashboard",{body:{demo_id:id}});
 if(!error&&typeof access?.html==="string"){
  const blob=new Blob([access.html],{type:"text/html;charset=utf-8"});
  return {loggedIn:true,active:true,url:URL.createObjectURL(blob)};
 }
 let reason=access?.error||"当前账号尚未开通有效会员。请先完成注册/登录，再联系甲子申核实并开通会员。";
 if(error&&error.context&&typeof error.context.json==="function"){try{const payload=await error.context.json();reason=payload.error||reason;}catch{}}
 return {loggedIn:true,active:false,reason};
}
async function loadPublicHtml(id){
 const {data,error}=await db.functions.invoke("get-private-dashboard",{body:{demo_id:id}});
 if(error){let message=data?.error||"读取公开看板失败。";if(error.context&&typeof error.context.json==="function"){try{const payload=await error.context.json();message=payload.error||message;}catch{}}throw new Error(message);}
 if(typeof data?.html!=="string")throw new Error(data?.error||"服务端未返回看板 HTML 内容。");
 return URL.createObjectURL(new Blob([data.html],{type:"text/html;charset=utf-8"}));
}
(async()=>{
 const status=document.getElementById("status");
 try{
  const id=new URLSearchParams(location.search).get("id");if(!id)throw new Error("缺少看板编号。");
  const {data:d,error}=await db.from("demos").select("id,name,description,page_url,private_path,access_mode,preview_url,qr_url,consult_text,preview_percent,is_published").eq("id",id).eq("is_published",true).maybeSingle();
  if(error)throw error;if(!d)throw new Error("该看板不存在或尚未发布。");
  document.title=d.name+"｜甲子申";
  const semi=d.access_mode!=="public";
  status.textContent=d.name+(semi?" · 公开预览 / 会员完整访问":" · 完整公开看板");
  const frame=document.getElementById("board-frame");
  if(!semi){
   // New public boards use private storage + server-side delivery, exactly like the working
   // semi-public HTML path but without login/member gating. Older external public URLs remain supported.
   if(d.private_path){frame.src=await loadPublicHtml(id);}
   else if(d.page_url){frame.src=d.page_url;}
   else throw new Error("该公开看板尚未配置 HTML 文件或外部网址。");
   document.getElementById("gate").style.display="none";
   status.textContent=d.name+" · 完整公开看板";
   return;
  }
  if(!d.private_path)throw new Error("该半公开看板尚未上传完整 HTML 文件，请联系管理员。");
  if(!d.preview_url)throw new Error("该半公开看板尚未配置游客预览版 HTML，请联系管理员。");
  // Visitors always see the public preview. Only a server-validated active member receives a signed URL for the private full HTML.
  const access=await tryLoadMemberHtml(id);
  if(access.active){frame.src=access.url;document.getElementById("gate").style.display="none";status.textContent=d.name+" · 会员权限已验证，正在加载完整内容";return;}
  frame.setAttribute("scrolling","no");frame.classList.add("preview-locked");document.body.style.overflow="hidden";
  frame.src=d.preview_url;
  setGate(d,id,access.loggedIn,access.reason||"");
  status.textContent=d.name+(access.loggedIn?" · 预览模式（当前账号尚未开通会员）":" · 游客预览模式");
 }catch(e){console.error(e);document.getElementById("main").innerHTML='<div class="error">'+safe(e.message||"看板暂时无法打开")+'<br><a href="./">返回甲子申首页</a></div>';status.textContent="看板暂时无法打开";}
})();
</script></body></html>
