<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10263d"><title>研究看板｜甲子申</title><style>
:root{--navy:#10263d;--navy2:#193c58;--gold:#c5a46a;--paper:#f5f4ef;--ink:#1b2d3c;--muted:#6c7a83}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.top{height:64px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1160px)/2));gap:15px}.brand{font-size:13px;letter-spacing:2px;font-weight:650}.top a{color:#d8c49a;font-size:12px;text-decoration:none}.status{padding:10px 20px;font-size:12px;color:var(--muted);background:#ecece6}.frame-wrap{position:relative;width:100%;height:calc(100vh - 104px);min-height:600px;background:#fff}.frame{width:100%;height:100%;border:0;background:white}.gate{position:absolute;left:0;right:0;top:60%;bottom:0;display:none;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(245,244,239,.90),#f5f4ef 18%);border-top:1px solid #d9d4c7}.gate-card{width:min(760px,100%);background:#10263d;color:white;padding:clamp(24px,4vw,42px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 18px 50px #10263d22}.gate h1{font-size:clamp(22px,3vw,30px);margin:0 0 12px;line-height:1.35}.gate p{font-size:14px;line-height:1.9;color:#d0dbe1;margin:0}.qr{width:132px;height:132px;object-fit:contain;background:#fff;padding:6px}.qr-placeholder{width:132px;height:132px;background:#fff;color:#315b68;display:grid;place-items:center;text-align:center;font-size:12px;padding:12px}.footnote{font-size:11px;color:#9eb0b9;margin-top:14px;line-height:1.7}.error{padding:40px 20px;line-height:1.8}.member-wall{max-width:780px;margin:48px auto;padding:0 18px}.member-card{background:#fff;border:1px solid #e0e4e5;border-radius:14px;padding:clamp(24px,5vw,44px);box-shadow:0 16px 42px #10263d0c}.member-card h1{font-size:clamp(24px,4vw,34px);line-height:1.3;color:var(--navy);margin:0 0 12px}.member-card p{font-size:14px;line-height:1.9;color:var(--muted)}.member-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.member-actions a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:11px 16px;border-radius:6px;font-size:13px}.member-actions a.secondary{background:#fff;color:var(--navy);border:1px solid #ccd4da}.member-qr{width:130px;height:130px;object-fit:contain;background:#fff;margin-top:12px}.member-status{font-size:13px;color:#8c5a24;margin-top:12px;line-height:1.7}@media(max-width:640px){.top{height:58px}.frame-wrap{height:calc(100vh - 98px);min-height:540px}.gate{top:60%;padding:12px}.gate-card{grid-template-columns:1fr;padding:22px;gap:16px}.qr,.qr-placeholder{width:100px;height:100px}}
</style></head><body><header class="top"><a class="brand" href="./" style="color:white">甲子申 · 产业研究</a><a href="./">返回看板中心 ↗</a></header><div class="status" id="status">正在读取看板设置……</div><main id="main"><div class="frame-wrap"><iframe id="board-frame" class="frame" title="产业研究看板"></iframe><section id="gate" class="gate"><div class="gate-card"><div><h1 id="gate-title">查看完整研究内容</h1><p id="gate-copy">当前为预览版。完整产业数据与深度研究，可扫码咨询定制服务。</p><div class="footnote">提示：预览内容仅供研究参考；定制内容与服务范围以双方沟通确认为准。</div></div><div id="qr-area"><div class="qr-placeholder">微信扫码<br>咨询定制</div></div></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://zlfedybzoxlvjbzpluuo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Ys9qA2p-xcMMGGUPMbHbJw_6_HdzMkQ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function limitPreviewScroll(frame,pct){try{const w=frame.contentWindow,doc=frame.contentDocument;if(!w||!doc||!doc.documentElement)return false;let maxAllowed=0;const recalc=()=>{const root=doc.documentElement,body=doc.body;const full=Math.max(root.scrollHeight,body?body.scrollHeight:0);const view=w.innerHeight||root.clientHeight||1;const maxScroll=Math.max(0,full-view);maxAllowed=Math.floor(maxScroll*pct/100);if(w.scrollY>maxAllowed)w.scrollTo(0,maxAllowed);};recalc();w.addEventListener("scroll",()=>{if(w.scrollY>maxAllowed+2)w.scrollTo(0,maxAllowed);},{passive:true});w.addEventListener("resize",recalc);doc.addEventListener("wheel",e=>{if(w.scrollY>=maxAllowed-1&&e.deltaY>0){e.preventDefault();w.scrollTo(0,maxAllowed);}},{passive:false});doc.addEventListener("keydown",e=>{if(["ArrowDown","PageDown"," ","End"].includes(e.key)&&w.scrollY>=maxAllowed-1){e.preventDefault();w.scrollTo(0,maxAllowed);}},{passive:false});if(w.ResizeObserver)new w.ResizeObserver(recalc).observe(doc.body||doc.documentElement);else{setTimeout(recalc,500);setTimeout(recalc,1800);}return true;}catch(e){console.warn("跨域看板无法限制内部滚动；请使用与 viewer.html 同域的 HTML 看板地址。",e);return false;}}
function showMessage(title,body,actions="",qrUrl="",status=""){document.getElementById("main").innerHTML=`<section class="member-wall"><div class="member-card"><h1>${safe(title)}</h1><p>${safe(body)}</p>${status?`<div class="member-status">${safe(status)}</div>`:""}${qrUrl?`<img class="member-qr" src="${safe(qrUrl)}" alt="甲子申咨询二维码">`:""}<div class="member-actions">${actions}</div></div></section>`;}
(async()=>{const status=document.getElementById("status");try{const id=new URLSearchParams(location.search).get("id");if(!id)throw new Error("缺少看板编号。");let result=await db.from("demos").select("id,name,description,page_url,access_mode,preview_url,qr_url,consult_text,preview_percent,is_published").eq("id",id).eq("is_published",true).maybeSingle();if(result.error)throw result.error;const d=result.data;if(!d)throw new Error("该看板不存在或尚未发布。");document.title=d.name+"｜甲子申";status.textContent=d.name+(d.access_mode==="members"?" · 会员专享":d.access_mode==="semi"?" · 公开预览":" · 完整看板");
 if(d.access_mode==="members"){
   const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError)throw sessionError;
   if(!session?.user){const ret="viewer.html?id="+encodeURIComponent(id);showMessage("这份产业研究面向甲子申会员开放","请先登录甲子申账号。尚未开通会员？可先注册，再通过咨询二维码联系甲子申，人工确认付款后即可开通全部会员看板。",`<a href="member.html?return=${encodeURIComponent(ret)}">登录 / 注册</a><a class="secondary" href="./">返回看板中心</a>`,d.qr_url||"","会员专享内容需要有效会员权限。");return;}
   status.textContent=d.name+" · 正在核验会员权限……";
   const {data:access,error:accessError}=await db.functions.invoke("get-private-dashboard",{body:{demo_id:id}});
   if(accessError||!access?.signed_url){let detail=access?.error||"当前账号尚未开通有效会员。";if(accessError&&accessError.context&&typeof accessError.context.json==="function"){try{const payload=await accessError.context.json();detail=payload.error||detail;}catch{}}showMessage("暂时无法查看完整看板", "会员专享内容仅向已开通的甲子申会员开放。若已付款，请确认使用付款时登记的邮箱登录，并联系管理员核实开通。",`<a href="member.html?return=${encodeURIComponent("viewer.html?id="+id)}">查看会员状态</a><a class="secondary" href="./">返回看板中心</a>`,d.qr_url||"",detail);status.textContent="会员权限验证未通过";return;}
   const frame=document.getElementById("board-frame");frame.src=access.signed_url;status.textContent=d.name+" · 会员权限已验证";return;
 }
 const semi=d.access_mode==="semi";const url=semi?(d.preview_url||d.page_url):d.page_url;if(!url)throw new Error("该看板尚未配置访问地址。");const frame=document.getElementById("board-frame");if(semi){const pct=Math.max(20,Math.min(70,Number(d.preview_percent)||45));const gate=document.getElementById("gate");document.getElementById("gate-title").textContent="查看完整研究内容";document.getElementById("gate-copy").textContent=d.consult_text||"当前为预览版。完整产业数据与深度研究，可扫码咨询定制服务。";if(d.qr_url)document.getElementById("qr-area").innerHTML='<img class="qr" alt="微信咨询二维码" src="'+safe(d.qr_url)+'">';gate.style.display="flex";frame.addEventListener("load",()=>{const ok=limitPreviewScroll(frame,pct);if(!ok)status.textContent=d.name+" · 预览模式（跨域页面无法限制内部滚动，请将预览 HTML 放在本网站同域）";},{once:true});}frame.src=url;
 }catch(e){console.error(e);document.getElementById("main").innerHTML='<div class="error">'+safe(e.message||"看板暂时无法打开")+'<br><a href="./">返回甲子申首页</a></div>';status.textContent="看板暂时无法打开";}})();
</script></body></html>
